name: CK2 main verified browser QA
on:
  push:
    branches: [main]
    paths: ['CK/**', '.github/workflows/ck2-main-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install browser verification tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Static smoke and syntax
        run: python CK/tests/smoke_test.py
      - name: Real browser checks over HTTP
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory CK > /tmp/ck2-http.log 2>&1 &
          sleep 2
          python CK/tests/browser_qa.py --base-url http://127.0.0.1:8000/ --output review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CK2-R2-browser-evidence
          path: review/
          retention-days: 14
