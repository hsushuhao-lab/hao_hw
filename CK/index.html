<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Clinic Kitchen 2.0 — Environment Walkthrough</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="app">
  <header class="hud">
    <div><strong>CLINIC KITCHEN 2.0</strong><span>M0 · ENVIRONMENT WALKTHROUGH</span></div>
    <div class="controls">WASD / Arrow：移動　Shift：快走　E：互動　R：重置</div>
  </header>
  <main id="world" tabindex="0" aria-label="Clinic Kitchen walkthrough">
    <div id="camera">
      <section class="room clinic">
        <h2>診間 CLINIC</h2>
        <div class="desk prop">醫師桌＋電腦</div>
        <div class="patient-chair prop">病人椅</div>
        <div class="printer prop">印表機</div>
        <div class="sink prop">洗手台</div>
      </section>
      <section class="room prep">
        <h2>過渡／備料 PREP</h2>
        <div class="fridge prop">冰箱</div>
        <div class="trolley prop">不鏽鋼推車</div>
        <div class="order-printer prop">料理處方機</div>
      </section>
      <section class="room kitchen">
        <h2>後廚 KITCHEN</h2>
        <div class="counter prop">備料檯</div>
        <div class="spice prop">香料架</div>
        <div class="wok prop">炒鍋爐台</div>
        <div class="rice prop">飯鍋</div>
      </section>
      <div id="player" class="player" aria-label="player"><div class="head"></div><div class="body"></div></div>
    </div>
    <div id="prompt" class="prompt">走到物件旁按 E 互動</div>
  </main>
  <aside class="mission">
    <h3>M0 成功條件</h3>
    <p>不看說明，也能理解前面是診間、中間是備料過渡區、後面是廚房，而且三區屬於同一個空間。</p>
    <ol><li>走到病人椅</li><li>走到料理處方機</li><li>走到冰箱</li><li>走到炒鍋</li></ol>
    <div id="log">尚未互動</div>
  </aside>
</div>
<script src="src/main.js"></script>
</body>
</html>
