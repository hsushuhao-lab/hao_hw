      <circle cx="122" cy="258" r="8" fill="#e6b88a"/>
      <path d="M200 150 L230 220 L200 255" stroke="#2b6cb0" stroke-width="16" stroke-linecap="round"/>
      <circle cx="198" cy="258" r="8" fill="#e6b88a"/>
      
