      <path d="M205 150 L235 190 L240 160" stroke="#dd6b20" stroke-width="14" stroke-linecap="round"/>
      <circle cx="240" cy="155" r="7" fill="#e6b88a"/>
      
    <!-- Head & Auntie perm curls -->
    <circle cx="160" cy="105" r="42" fill="#e6b88a"/>
    <!-- Curls -->
    <circle cx="124" cy="87" r="14" fill="#5a3a22"/>
    <circle cx="136" cy="67" r="15" fill="#5a3a22"/>
    <circle cx="160" cy="61" r="16" fill="#5a3a22"/>
    <circle cx="184" cy="67" r="15" fill="#5a3a22"/>
    <circle cx="196" cy="87" r="14" fill="#5a3a22"/>
    <!-- Cheerful eyes with laugh lines -->
