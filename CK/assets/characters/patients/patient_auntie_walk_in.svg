      <!-- Colorful auntie cardigan -->
      <path d="M115 145 L105 295 H215 L205 145 Z" fill="#dd6b20"/>
      <circle cx="140" cy="180" r="5" fill="#fbd38d"/>
      <circle cx="180" cy="180" r="5" fill="#fbd38d"/>
