<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440">
  <defs>
    <filter id="pat-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bowl-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="tofu-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e53e3e"/>
      <stop offset="100%" stop-color="#9b2c2c"/>
    </linearGradient>
  </defs>

    <g id="driver-order">
      
    <!-- Clinic Consultation Chair -->
    <rect x="115" y="270" width="90" height="12" rx="5" fill="#718096" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="122" y="215" width="76" height="58" rx="8" fill="#4a5568" stroke="#2d3748" stroke-width="2"/>
    <!-- Chair stem & caster base -->
    <rect x="154" y="282" width="12" height="50" rx="3" fill="#a0aec0"/>
    <path d="M120 332 L200 332" stroke="#2d3748" stroke-width="5" stroke-linecap="round"/>
    <circle cx="124" cy="336" r="5" fill="#1a202c"/>
    <circle cx="196" cy="336" r="5" fill="#1a202c"/>
    
      <path d="M135 270 L130 350 L120 375" stroke="#2d3748" stroke-width="18" stroke-linecap="round"/>
      <path d="M185 270 L190 350 L200 375" stroke="#2d3748" stroke-width="18" stroke-linecap="round"/>
      <path d="M115 145 L110 275 H210 L205 145 Z" fill="#c53030"/>
      <!-- Hearty gesture: 大辣！飯多！蔥多！ -->
      <path d="M115 150 L95 210 L125 220" stroke="#c53030" stroke-width="16" stroke-linecap="round"/>
      <circle cx="128" cy="222" r="8" fill="#d69e2e"/>
      <path d="M205 150 L235 180 L225 140" stroke="#c53030" stroke-width="16" stroke-linecap="round"/>
      <circle cx="225" cy="138" r="8" fill="#d69e2e"/>
      <!-- Speech bubble -->
      <rect x="175" y="25" width="135" height="42" rx="12" fill="#ffffff" stroke="#c53030" stroke-width="2"/>
      <text x="242" y="51" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c53030" text-anchor="middle">大辣！飯多！</text>
      <polygon points="190,67 200,67 185,80" fill="#ffffff" stroke="#c53030" stroke-width="1.5"/>
      
    <!-- Head -->
    <circle cx="160" cy="105" r="42" fill="#d69e2e"/>
    <!-- Driver Cap -->
    <path d="M116 93 Q120 55 160 57 Q200 55 204 93 Z" fill="#742a2a"/>
    <path d="M112 95 Q160 83 208 95 L215 100 Q160 89 105 100 Z" fill="#4a1a1a"/>
    <!-- Sturdy beard stubble / jaw -->
    <path d="M135 140 Q160 150 185 140" stroke="#975a16" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <!-- Eyes -->
    <circle cx="144" cy="110" r="4" fill="#1a202c"/>
    <circle cx="176" cy="110" r="4" fill="#1a202c"/>
    <!-- Strong eyebrows -->
    <path d="M134 99 H154" stroke="#4a1a1a" stroke-width="4" stroke-linecap="round"/>
    <path d="M166 99 H186" stroke="#4a1a1a" stroke-width="4" stroke-linecap="round"/>
    <!-- White towel around neck -->
    <path d="M125 135 Q160 160 195 135" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M148 133 H172" stroke="#742a2a" stroke-width="3.5" stroke-linecap="round"/>
    
    </g>
    
</svg>