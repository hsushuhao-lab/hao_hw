      <path d="M195 150 L205 210 L175 230" stroke="#cbd5e0" stroke-width="14" stroke-linecap="round"/>
      <circle cx="172" cy="230" r="6" fill="#e6b88a"/>
      <line x1="172" y1="230" x2="160" y2="155" stroke="#a0aec0" stroke-width="3" stroke-linecap="round"/>
      
    <!-- Steaming Bowl of Mapo Tofu -->
    <ellipse cx="160" cy="252" rx="38" ry="14" fill="url(#bowl-grad)" stroke="#cbd5e0" stroke-width="2"/>
    <ellipse cx="160" cy="250" rx="32" ry="10" fill="url(#tofu-red)"/>
    <rect x="146" y="246" width="7" height="6" rx="1.5" fill="#ffffff"/>
    <rect x="158" y="247" width="7" height="6" rx="1.5" fill="#ffffff"/>
    <rect x="170" y="245" width="7" height="6" rx="1.5" fill="#ffffff"/>
    <circle cx="153" cy="248" r="2.5" fill="#48bb78"/>
    <circle cx="166" cy="248" r="2.5" fill="#48bb78"/>
    <!-- Steam -->
    <path d="M148 240 Q144 222 152 208" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M170 240 Q175 222 166 208" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    
      
    <!-- Head & Neat minimalist hair -->
