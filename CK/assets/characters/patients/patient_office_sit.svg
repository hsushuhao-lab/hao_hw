<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440">
  <defs>
    <filter id="pat-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bowl-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="tofu-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e53e3e"/>
      <stop offset="100%" stop-color="#9b2c2c"/>
    </linearGradient>
  </defs>

    <g id="office-sit">
      
    <!-- Clinic Consultation Chair -->
    <rect x="115" y="270" width="90" height="12" rx="5" fill="#718096" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="122" y="215" width="76" height="58" rx="8" fill="#4a5568" stroke="#2d3748" stroke-width="2"/>
    <!-- Chair stem & caster base -->
    <rect x="154" y="282" width="12" height="50" rx="3" fill="#a0aec0"/>
    <path d="M120 332 L200 332" stroke="#2d3748" stroke-width="5" stroke-linecap="round"/>
    <circle cx="124" cy="336" r="5" fill="#1a202c"/>
    <circle cx="196" cy="336" r="5" fill="#1a202c"/>
    
      <!-- Seated legs -->
      <path d="M135 270 L130 350 L120 375" stroke="#1a202c" stroke-width="16" stroke-linecap="round"/>
      <path d="M185 270 L190 350 L200 375" stroke="#1a202c" stroke-width="16" stroke-linecap="round"/>
      <!-- Torso -->
      <path d="M125 145 L120 275 H200 L195 145 Z" fill="#2d3748"/>
      <polygon points="152,145 168,145 165,225 160,235 155,225" fill="#e53e3e"/>
      <!-- Hands resting nervously on knees -->
      <path d="M125 150 L105 220 L130 260" stroke="#2d3748" stroke-width="14" stroke-linecap="round"/>
      <circle cx="132" cy="265" r="7" fill="#e6b88a"/>
      <path d="M195 150 L215 220 L190 260" stroke="#2d3748" stroke-width="14" stroke-linecap="round"/>
      <circle cx="188" cy="265" r="7" fill="#e6b88a"/>
      <!-- Briefcase on floor next to chair -->
      <rect x="75" y="325" width="28" height="36" rx="4" fill="#744210" stroke="#975a16" stroke-width="1.5"/>
      
    <!-- Head & Anxious office hair -->
    <circle cx="160" cy="105" r="40" fill="#e6b88a"/>
    <path d="M120 100 Q124 59 160 61 Q200 61 202 101 Q180 85 160 85 Q138 85 120 100 Z" fill="#2d3748"/>
    <!-- Worried angled eyebrows -->
    <path d="M134 91 L152 87" stroke="#1a202c" stroke-width="3" stroke-linecap="round"/>
    <path d="M168 87 L186 91" stroke="#1a202c" stroke-width="3" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="145" cy="105" r="3.5" fill="#1a202c"/>
    <circle cx="175" cy="105" r="3.5" fill="#1a202c"/>
    <path d="M150 133 Q160 127 170 133" stroke="#742a2a" stroke-width="2.5" fill="none"/>
    <path d="M192 110 Q198 120 194 125 Q190 120 192 110 Z" fill="#63b3ed"/>
    
    </g>
    
</svg>