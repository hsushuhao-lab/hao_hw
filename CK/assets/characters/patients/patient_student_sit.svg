<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440">
  <defs>
    <filter id="pat-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bowl-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="tofu-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e53e3e"/>
      <stop offset="100%" stop-color="#9b2c2c"/>
    </linearGradient>
  </defs>

    <g id="student-sit">
      
    <!-- Clinic Consultation Chair -->
    <rect x="115" y="270" width="90" height="12" rx="5" fill="#718096" stroke="#4a5568" stroke-width="1.5"/>
    <rect x="122" y="215" width="76" height="58" rx="8" fill="#4a5568" stroke="#2d3748" stroke-width="2"/>
    <!-- Chair stem & caster base -->
    <rect x="154" y="282" width="12" height="50" rx="3" fill="#a0aec0"/>
    <path d="M120 332 L200 332" stroke="#2d3748" stroke-width="5" stroke-linecap="round"/>
    <circle cx="124" cy="336" r="5" fill="#1a202c"/>
    <circle cx="196" cy="336" r="5" fill="#1a202c"/>
    
      <path d="M135 270 L130 350 L120 375" stroke="#2d3748" stroke-width="16" stroke-linecap="round"/>
      <path d="M185 270 L190 350 L200 375" stroke="#2d3748" stroke-width="16" stroke-linecap="round"/>
      <path d="M120 145 L115 275 H205 L200 145 Z" fill="#4a5568"/>
      <!-- Backpack resting on back of chair -->
      <rect x="195" y="200" width="35" height="60" rx="8" fill="#1a202c"/>
      <!-- Hands resting wearily on lap -->
      <path d="M120 150 L105 220 L140 260" stroke="#4a5568" stroke-width="14" stroke-linecap="round"/>
      <circle cx="142" cy="262" r="7" fill="#e6b88a"/>
      <path d="M200 150 L215 220 L180 260" stroke="#4a5568" stroke-width="14" stroke-linecap="round"/>
      <circle cx="178" cy="262" r="7" fill="#e6b88a"/>
      
    <!-- Head & Shaggy student hair -->
    <circle cx="160" cy="105" r="40" fill="#e6b88a"/>
    <path d="M118 105 Q120 57 160 59 Q200 57 202 105 Q175 90 150 90 Q130 93 118 105 Z" fill="#2d3748"/>
    <!-- Weary student round glasses -->
    <g fill="none" stroke="#4a5568" stroke-width="2.5">
      <circle cx="144" cy="107" r="12"/>
      <circle cx="176" cy="107" r="12"/>
      <line x1="156" y1="107" x2="164" y2="107"/>
    </g>
    <circle cx="144" cy="107" r="3" fill="#1a202c"/>
    <circle cx="176" cy="107" r="3" fill="#1a202c"/>
    <!-- Droopy tired eyebrows -->
    <path d="M136 91 Q145 93 152 89" stroke="#2d3748" stroke-width="2.5" fill="none"/>
    <path d="M168 89 Q175 93 184 91" stroke="#2d3748" stroke-width="2.5" fill="none"/>
    <path d="M150 133 H170" stroke="#742a2a" stroke-width="2.5" stroke-linecap="round"/>
    
    </g>
    
</svg>