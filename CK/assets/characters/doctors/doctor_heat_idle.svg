<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-fire" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="knife-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9e2ec"/>
      <stop offset="100%" stop-color="#9fb3c8"/>
    </linearGradient>
    <linearGradient id="wok-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334e68"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d84c38"/>
      <stop offset="50%" stop-color="#f38b4a"/>
      <stop offset="100%" stop-color="#f7d070"/>
    </linearGradient>
    <linearGradient id="rx-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#347d69"/>
      <stop offset="100%" stop-color="#8ac6a7"/>
    </linearGradient>
  </defs>

    <g id="heat-idle">
      
    <!-- Legs & Shoes -->
    <path d="M138 360 L134 442 H162 L166 360 Z" fill="#102a43"/>
    <path d="M194 360 L198 442 H226 L222 360 Z" fill="#102a43"/>
    <rect x="126" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    <rect x="196" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    
      
    <!-- Torso: Lab coat over blue shirt & red flame tie -->
    <path d="M132 160 L126 360 H234 L228 160 Z" fill="#f8fbff" stroke="#d9e2ec" stroke-width="2"/>
    <path d="M156 160 L180 205 L204 160 Z" fill="#8ba8c4"/>
    <!-- Red tie -->
    <polygon points="174,200 186,200 189,280 180,295 171,280" fill="#e85d4a"/>
    <!-- Coat lapels -->
    <path d="M132 160 L162 225 L144 285 L132 360" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    <path d="M228 160 L198 225 L216 285 L228 360" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    
      <!-- Left arm holding iron wok at side -->
      <path d="M132 175 Q90 220 95 280 L120 285 Q115 235 150 190 Z" fill="#f8fbff"/>
      <circle cx="102" cy="290" r="9" fill="#d8a77a"/>
      <ellipse cx="65" cy="300" rx="35" ry="42" fill="url(#wok-grad)"/>
      <ellipse cx="65" cy="300" rx="28" ry="34" fill="#2d3748"/>
      <!-- Right arm holding spice bottle -->
      <path d="M228 175 Q265 215 255 265 L232 268 Q240 225 210 190 Z" fill="#f8fbff"/>
      <circle cx="250" cy="272" r="9" fill="#d8a77a"/>
      <rect x="242" y="248" width="16" height="28" rx="4" fill="#e85d4a" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="246" y="240" width="8" height="8" rx="2" fill="#e2e8f0"/>
      
    <!-- Head & Hair -->
    <circle cx="180" cy="110" r="46" fill="#d8a77a"/>
    <!-- Neat, mature combed hair -->
    <path d="M134 104 Q138 58 180 60 Q224 62 226 106 Q204 88 180 86 Q156 86 134 104 Z" fill="#1e242b"/>
    <!-- Eyes -->
    <circle cx="163" cy="112" r="4" fill="#102a43"/>
    <circle cx="197" cy="112" r="4" fill="#102a43"/>
    <!-- Eyebrows -->
    <path d="M152 96 H172" fill="none" stroke="#1e242b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M188 96 H208" fill="none" stroke="#1e242b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Glasses -->
    <g fill="none" stroke="#26394c" stroke-width="3.5">
      <rect x="146" cy="100" width="26" height="22" rx="6"/>
      <rect x="188" cy="100" width="26" height="22" rx="6"/>
      <path d="M172 111 H188"/>
    </g>
    <path d="M166 138 Q180 145 194 138" fill="none" stroke="#7a4b3f" stroke-width="3.5" stroke-linecap="round"/>
    
    </g>
    
</svg>