<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-fire" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="knife-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9e2ec"/>
      <stop offset="100%" stop-color="#9fb3c8"/>
    </linearGradient>
    <linearGradient id="wok-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334e68"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d84c38"/>
      <stop offset="50%" stop-color="#f38b4a"/>
      <stop offset="100%" stop-color="#f7d070"/>
    </linearGradient>
    <linearGradient id="rx-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#347d69"/>
      <stop offset="100%" stop-color="#8ac6a7"/>
    </linearGradient>
  </defs>

    <g id="heat-entrance">
      <!-- Flame ignite sparks from wok spatula -->
      <g filter="url(#glow-fire)">
        <path d="M240 180 Q255 130 245 100 Q270 140 280 180 Q260 210 240 180 Z" fill="url(#flame-grad)"/>
        <circle cx="260" cy="115" r="5" fill="#f7d070"/>
        <circle cx="280" cy="140" r="4" fill="#f38b4a"/>
      </g>
      
    <!-- Legs & Shoes -->
    <path d="M133 360 L129 442 H157 L161 360 Z" fill="#102a43"/>
    <path d="M199 360 L203 442 H231 L227 360 Z" fill="#102a43"/>
    <rect x="121" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    <rect x="201" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    
      
    <!-- Torso: Lab coat over blue shirt & red flame tie -->
    <path d="M132 155 L126 355 H234 L228 155 Z" fill="#f8fbff" stroke="#d9e2ec" stroke-width="2"/>
    <path d="M156 155 L180 200 L204 155 Z" fill="#8ba8c4"/>
    <!-- Red tie -->
    <polygon points="174,195 186,195 189,275 180,290 171,275" fill="#e85d4a"/>
    <!-- Coat lapels -->
    <path d="M132 155 L162 220 L144 280 L132 355" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    <path d="M228 155 L198 220 L216 280 L228 355" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    
      <!-- Left arm holding iron wok forward with authority -->
      <path d="M132 175 Q80 190 70 240 L92 245 Q100 210 148 185 Z" fill="#f8fbff"/>
      <circle cx="78" cy="246" r="9" fill="#d8a77a"/>
      <ellipse cx="60" cy="255" rx="38" ry="24" fill="url(#wok-grad)"/>
      <!-- Right arm raising spatula with ignite flame -->
      <path d="M228 175 Q275 190 260 150 L240 155 Q250 195 210 185 Z" fill="#f8fbff"/>
      <circle cx="256" cy="152" r="9" fill="#d8a77a"/>
      <rect x="252" y="140" width="8" height="40" rx="3" fill="#a0aec0" transform="rotate(-25 256 160)"/>
      
    <!-- Head & Hair -->
    <circle cx="180" cy="105" r="46" fill="#d8a77a"/>
    <!-- Neat, mature combed hair -->
    <path d="M134 99 Q138 53 180 55 Q224 57 226 101 Q204 83 180 81 Q156 81 134 99 Z" fill="#1e242b"/>
    <!-- Eyes -->
    <circle cx="163" cy="107" r="4" fill="#102a43"/>
    <circle cx="197" cy="107" r="4" fill="#102a43"/>
    <!-- Eyebrows -->
    <path d="M152 91 H172" fill="none" stroke="#1e242b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M188 91 H208" fill="none" stroke="#1e242b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Glasses -->
    <g fill="none" stroke="#26394c" stroke-width="3.5">
      <rect x="146" cy="95" width="26" height="22" rx="6"/>
      <rect x="188" cy="95" width="26" height="22" rx="6"/>
      <path d="M172 106 H188"/>
    </g>
    <path d="M164 131 Q180 143 196 131" fill="none" stroke="#7a4b3f" stroke-width="3.5" stroke-linecap="round"/>
    
    </g>
    
</svg>