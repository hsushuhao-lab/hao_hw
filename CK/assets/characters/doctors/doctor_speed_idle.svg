<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-fire" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="knife-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9e2ec"/>
      <stop offset="100%" stop-color="#9fb3c8"/>
    </linearGradient>
    <linearGradient id="wok-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334e68"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d84c38"/>
      <stop offset="50%" stop-color="#f38b4a"/>
      <stop offset="100%" stop-color="#f7d070"/>
    </linearGradient>
    <linearGradient id="rx-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#347d69"/>
      <stop offset="100%" stop-color="#8ac6a7"/>
    </linearGradient>
  </defs>

    <g id="speed-idle">
      
    <!-- Legs & Shoes -->
    <path d="M143 360 L139 442 H167 L171 360 Z" fill="#102a43"/>
    <path d="M189 360 L193 442 H221 L217 360 Z" fill="#102a43"/>
    <rect x="131" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    <rect x="191" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    
      
    <!-- Torso: Lab coat over shirt & tie -->
    <path d="M134 160 L126 360 H234 L226 160 Z" fill="#f8fbff" stroke="#d9e2ec" stroke-width="2"/>
    <path d="M156 160 L180 205 L204 160 Z" fill="#eceff1"/>
    <!-- Yellow tie -->
    <polygon points="174,200 186,200 189,280 180,295 171,280" fill="#f3b84a"/>
    <!-- Coat lapels -->
    <path d="M134 160 L162 225 L144 285 L132 360" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    <path d="M226 160 L198 225 L216 285 L228 360" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    
      <!-- Left arm holding prep tray -->
      <path d="M134 175 Q95 210 90 260 L120 270 Q125 220 152 195 Z" fill="#f8fbff"/>
      <rect x="52" y="250" width="75" height="16" rx="5" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
      <circle cx="70" cy="245" r="7" fill="#ffffff" stroke="#90a4ae"/>
      <circle cx="90" cy="244" r="8" fill="#48bb78"/>
      <circle cx="110" cy="245" r="7" fill="#e53e3e"/>
      <circle cx="98" cy="265" r="9" fill="#e6b88a"/>
      <!-- Right arm holding quick chef knife -->
      <path d="M226 175 Q265 205 270 250 L242 260 Q236 220 208 195 Z" fill="#f8fbff"/>
      <circle cx="265" cy="254" r="9" fill="#e6b88a"/>
      <rect x="264" y="248" width="14" height="8" rx="2" fill="#8d6e63"/>
      <path d="M278 245 L320 240 L315 260 L278 255 Z" fill="url(#knife-blade)" stroke="#9fb3c8" stroke-width="1.5"/>
      
    <!-- Head & Hair -->
    <circle cx="180" cy="110" r="46" fill="#e6b88a"/>
    <!-- Energetic swooping hair -->
    <path d="M134 100 Q140 60 180 58 Q224 60 228 102 Q210 85 188 88 Q156 90 134 100 Z" fill="#20252d"/>
    <path d="M160 65 Q170 48 195 60 Q175 62 160 65 Z" fill="#334050"/>
    <!-- Eyes -->
    <circle cx="162" cy="112" r="4" fill="#102a43"/>
    <circle cx="198" cy="112" r="4" fill="#102a43"/>
    <!-- Glasses -->
    <g fill="none" stroke="#26394c" stroke-width="3.5">
      <rect x="144" cy="100" width="28" height="22" rx="7"/>
      <rect x="188" cy="100" width="28" height="22" rx="7"/>
      <path d="M172 110 H188"/>
    </g>
    <!-- Eyebrows -->
    <path d="M148 94 Q160 88 172 92" fill="none" stroke="#20252d" stroke-width="3" stroke-linecap="round"/>
    <path d="M188 92 Q200 88 212 94" fill="none" stroke="#20252d" stroke-width="3" stroke-linecap="round"/>
    <path d="M162 138 Q180 150 198 138" fill="none" stroke="#7a4b3f" stroke-width="3.5" stroke-linecap="round"/>
    
    </g>
    
</svg>