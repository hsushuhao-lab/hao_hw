<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-fire" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="knife-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9e2ec"/>
      <stop offset="100%" stop-color="#9fb3c8"/>
    </linearGradient>
    <linearGradient id="wok-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334e68"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d84c38"/>
      <stop offset="50%" stop-color="#f38b4a"/>
      <stop offset="100%" stop-color="#f7d070"/>
    </linearGradient>
    <linearGradient id="rx-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#347d69"/>
      <stop offset="100%" stop-color="#8ac6a7"/>
    </linearGradient>
  </defs>

    <g id="strategy-cut">
      <!-- Timed, calculated cut with stopwatch / metronome precision -->
      <rect x="50" y="320" width="260" height="38" rx="8" fill="#e2d4be" stroke="#bfa98b" stroke-width="2.5"/>
      <rect x="125" y="312" width="50" height="24" rx="3" fill="#ffffff" stroke="#cbd5e0" stroke-width="2"/>
      
    <!-- Legs & Shoes -->
    <path d="M143 355 L139 442 H167 L171 355 Z" fill="#102a43"/>
    <path d="M189 355 L193 442 H221 L217 355 Z" fill="#102a43"/>
    <rect x="131" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    <rect x="191" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    
      
    <!-- Torso: Lab coat over mint-green scrubs -->
    <path d="M132 155 L126 355 H234 L228 155 Z" fill="#f8fbff" stroke="#d9e2ec" stroke-width="2"/>
    <path d="M156 155 L180 200 L204 155 Z" fill="#57b2a4"/>
    <!-- Stethoscope around neck -->
    <path d="M145 160 Q150 235 165 260 L175 275" fill="none" stroke="#26394c" stroke-width="4" stroke-linecap="round"/>
    <path d="M215 160 Q210 235 195 260 L175 275" fill="none" stroke="#26394c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="175" cy="279" r="8" fill="#a0aec0" stroke="#26394c" stroke-width="2"/>
    <!-- Coat lapels -->
    <path d="M132 155 L162 220 L144 280 L132 355" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    <path d="M228 155 L198 220 L216 280 L228 355" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    
      <!-- Left hand checking wristwatch -->
      <path d="M135 175 Q95 215 120 260 L140 252 Q120 220 155 190 Z" fill="#f8fbff"/>
      <circle cx="125" cy="265" r="9" fill="#e6b88a"/>
      <circle cx="118" cy="260" r="8" fill="#26394c"/>
      <circle cx="118" cy="260" r="6" fill="#f7fafc"/>
      <!-- Right hand timed clean knife cut -->
      <path d="M225 175 Q250 220 215 275 L195 270 Q225 220 205 190 Z" fill="#f8fbff"/>
      <circle cx="212" cy="282" r="9" fill="#e6b88a"/>
      <rect x="206" y="275" width="10" height="42" rx="2" fill="url(#knife-blade)" stroke="#9fb3c8" stroke-width="1.5"/>
      
    <!-- Head & Hair -->
    <circle cx="180" cy="110" r="46" fill="#e6b88a"/>
    <!-- Neat intellectual side-parted hair -->
    <path d="M134 104 Q144 58 180 62 Q224 62 226 108 Q200 90 180 90 Q156 88 134 104 Z" fill="#18314f"/>
    <!-- Eyes -->
    <circle cx="163" cy="112" r="4" fill="#102a43"/>
    <circle cx="197" cy="112" r="4" fill="#102a43"/>
    <!-- Round wireframe glasses -->
    <g fill="none" stroke="#26394c" stroke-width="3.5">
      <circle cx="160" cy="110" r="15"/>
      <circle cx="200" cy="110" r="15"/>
      <path d="M175 110 H185"/>
    </g>
    <!-- Eyebrows -->
    <path d="M150 92 Q160 88 170 92" fill="none" stroke="#18314f" stroke-width="3" stroke-linecap="round"/>
    <path d="M190 92 Q200 88 210 92" fill="none" stroke="#18314f" stroke-width="3" stroke-linecap="round"/>
    <!-- Mask resting below chin or covering mouth -->
    <path d="M154 132 Q180 148 206 132 L200 155 Q180 162 160 155 Z" fill="#72bdae" opacity="0.85"/>
    <path d="M168 138 Q180 143 192 138" fill="none" stroke="#7a4b3f" stroke-width="3" stroke-linecap="round"/>
    
    </g>
    
</svg>