<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-fire" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="knife-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9e2ec"/>
      <stop offset="100%" stop-color="#9fb3c8"/>
    </linearGradient>
    <linearGradient id="wok-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334e68"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d84c38"/>
      <stop offset="50%" stop-color="#f38b4a"/>
      <stop offset="100%" stop-color="#f7d070"/>
    </linearGradient>
    <linearGradient id="rx-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#347d69"/>
      <stop offset="100%" stop-color="#8ac6a7"/>
    </linearGradient>
  </defs>

    <g id="speed-entrance">
      <!-- Speed dash trails & dust -->
      <g opacity="0.75">
        <path d="M10 390 H90 M25 410 H130 M5 430 H80" stroke="#f3b84a" stroke-width="4" stroke-linecap="round"/>
        <path d="M40 370 H110 M20 350 H85" stroke="#ffe082" stroke-width="3" stroke-linecap="round"/>
        <circle cx="100" cy="425" r="14" fill="#f3b84a" opacity="0.3"/>
        <circle cx="125" cy="405" r="9" fill="#f3b84a" opacity="0.4"/>
      </g>
      <!-- Dynamic sliding pose -->
      <g transform="rotate(-6 180 240)">
        
    <!-- Legs & Shoes -->
    <path d="M128 360 L124 432 H152 L156 360 Z" fill="#102a43"/>
    <path d="M204 360 L208 432 H236 L232 360 Z" fill="#102a43"/>
    <rect x="116" y="432" width="38" height="18" rx="8" fill="#1e3a5f"/>
    <rect x="206" y="432" width="38" height="18" rx="8" fill="#1e3a5f"/>
    
        
    <!-- Torso: Lab coat over shirt & tie -->
    <path d="M134 150 L126 350 H234 L226 150 Z" fill="#f8fbff" stroke="#d9e2ec" stroke-width="2"/>
    <path d="M156 150 L180 195 L204 150 Z" fill="#eceff1"/>
    <!-- Yellow tie -->
    <polygon points="174,190 186,190 189,270 180,285 171,270" fill="#f3b84a"/>
    <!-- Coat lapels -->
    <path d="M134 150 L162 215 L144 275 L132 350" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    <path d="M226 150 L198 215 L216 275 L228 350" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    
        <!-- Left arm thrust forward holding tray -->
        <path d="M134 165 Q70 170 50 195 L65 215 Q95 195 145 185 Z" fill="#f8fbff"/>
        <rect x="25" y="180" width="80" height="18" rx="6" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
        <circle cx="50" cy="175" r="8" fill="#48bb78"/>
        <circle cx="75" cy="174" r="8" fill="#ffffff" stroke="#90a4ae"/>
        <circle cx="60" cy="202" r="9" fill="#e6b88a"/>
        <!-- Right arm swinging knife in flair -->
        <path d="M226 165 Q275 160 305 130 L320 145 Q285 185 215 190 Z" fill="#f8fbff"/>
        <circle cx="310" cy="132" r="9" fill="#e6b88a"/>
        <path d="M316 128 L350 90 L342 82 L310 120 Z" fill="url(#knife-blade)" stroke="#9fb3c8" stroke-width="1.5"/>
        <path d="M340 75 L355 95 L335 90 Z" fill="#ffe082"/>
        
    <!-- Head & Hair -->
    <circle cx="180" cy="100" r="46" fill="#e6b88a"/>
    <!-- Energetic swooping hair -->
    <path d="M134 90 Q140 50 180 48 Q224 50 228 92 Q210 75 188 78 Q156 80 134 90 Z" fill="#20252d"/>
    <path d="M160 55 Q170 38 195 50 Q175 52 160 55 Z" fill="#334050"/>
    <!-- Eyes -->
    <circle cx="162" cy="102" r="4" fill="#102a43"/>
    <circle cx="198" cy="102" r="4" fill="#102a43"/>
    <!-- Glasses -->
    <g fill="none" stroke="#26394c" stroke-width="3.5">
      <rect x="144" cy="90" width="28" height="22" rx="7"/>
      <rect x="188" cy="90" width="28" height="22" rx="7"/>
      <path d="M172 100 H188"/>
    </g>
    <!-- Eyebrows -->
    <path d="M148 84 Q160 78 172 82" fill="none" stroke="#20252d" stroke-width="3" stroke-linecap="round"/>
    <path d="M188 82 Q200 78 212 84" fill="none" stroke="#20252d" stroke-width="3" stroke-linecap="round"/>
    <path d="M162 124 Q180 142 198 124 Z" fill="#7a4b3f"/><path d="M168 125 Q180 133 192 125" fill="#ffffff"/>
    
      </g>
    </g>
    
</svg>