<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-fire" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="knife-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9e2ec"/>
      <stop offset="100%" stop-color="#9fb3c8"/>
    </linearGradient>
    <linearGradient id="wok-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334e68"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d84c38"/>
      <stop offset="50%" stop-color="#f38b4a"/>
      <stop offset="100%" stop-color="#f7d070"/>
    </linearGradient>
    <linearGradient id="rx-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#347d69"/>
      <stop offset="100%" stop-color="#8ac6a7"/>
    </linearGradient>
  </defs>

    <g id="strategy-entrance">
      <!-- Order slips floating in analytical rhythm -->
      <g opacity="0.8">
        <rect x="50" y="140" width="34" height="46" rx="3" fill="#ffffff" stroke="#57b2a4" stroke-width="1.5" transform="rotate(-15 67 163)"/>
        <text x="60" y="165" font-size="12" font-weight="bold" fill="#57b2a4">Rx</text>
        <rect x="280" y="150" width="34" height="46" rx="3" fill="#ffffff" stroke="#57b2a4" stroke-width="1.5" transform="rotate(18 297 173)"/>
        <text x="290" y="175" font-size="12" font-weight="bold" fill="#57b2a4">Rx</text>
      </g>
      
    <!-- Legs & Shoes -->
    <path d="M138 360 L134 442 H162 L166 360 Z" fill="#102a43"/>
    <path d="M194 360 L198 442 H226 L222 360 Z" fill="#102a43"/>
    <rect x="126" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    <rect x="196" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    
      
    <!-- Torso: Lab coat over mint-green scrubs -->
    <path d="M132 155 L126 355 H234 L228 155 Z" fill="#f8fbff" stroke="#d9e2ec" stroke-width="2"/>
    <path d="M156 155 L180 200 L204 155 Z" fill="#57b2a4"/>
    <!-- Stethoscope around neck -->
    <path d="M145 160 Q150 235 165 260 L175 275" fill="none" stroke="#26394c" stroke-width="4" stroke-linecap="round"/>
    <path d="M215 160 Q210 235 195 260 L175 275" fill="none" stroke="#26394c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="175" cy="279" r="8" fill="#a0aec0" stroke="#26394c" stroke-width="2"/>
    <!-- Coat lapels -->
    <path d="M132 155 L162 220 L144 280 L132 355" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    <path d="M228 155 L198 220 L216 280 L228 355" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    
      <!-- Left arm holding clipboard firmly -->
      <path d="M132 175 Q85 200 95 250 L120 255 Q115 215 152 185 Z" fill="#f8fbff"/>
      <circle cx="102" cy="256" r="9" fill="#e6b88a"/>
      <rect x="70" y="220" width="55" height="75" rx="5" fill="#8d6e63"/>
      <rect x="75" y="228" width="45" height="62" rx="2" fill="#ffffff"/>
      <!-- Right hand gracefully adjusting glasses -->
      <path d="M228 175 Q265 180 235 125 L215 132 Q235 180 208 185 Z" fill="#f8fbff"/>
      <circle cx="228" cy="122" r="8" fill="#e6b88a"/>
      
    <!-- Head & Hair -->
    <circle cx="180" cy="105" r="46" fill="#e6b88a"/>
    <!-- Neat intellectual side-parted hair -->
    <path d="M134 99 Q144 53 180 57 Q224 57 226 103 Q200 85 180 85 Q156 83 134 99 Z" fill="#18314f"/>
    <!-- Eyes -->
    <circle cx="163" cy="107" r="4" fill="#102a43"/>
    <circle cx="197" cy="107" r="4" fill="#102a43"/>
    <!-- Round wireframe glasses -->
    <g fill="none" stroke="#26394c" stroke-width="3.5">
      <circle cx="160" cy="105" r="15"/>
      <circle cx="200" cy="105" r="15"/>
      <path d="M175 105 H185"/>
    </g>
    <!-- Eyebrows -->
    <path d="M150 87 Q160 83 170 87" fill="none" stroke="#18314f" stroke-width="3" stroke-linecap="round"/>
    <path d="M190 87 Q200 83 210 87" fill="none" stroke="#18314f" stroke-width="3" stroke-linecap="round"/>
    <!-- Mask resting below chin or covering mouth -->
    <path d="M154 127 Q180 143 206 127 L200 150 Q180 157 160 150 Z" fill="#72bdae" opacity="0.85"/>
    <path d="M166 131 Q180 141 194 131" fill="none" stroke="#7a4b3f" stroke-width="3.5" stroke-linecap="round"/>
    
    </g>
    
</svg>