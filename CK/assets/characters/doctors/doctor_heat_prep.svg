<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-fire" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="knife-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9e2ec"/>
      <stop offset="100%" stop-color="#9fb3c8"/>
    </linearGradient>
    <linearGradient id="wok-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334e68"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d84c38"/>
      <stop offset="50%" stop-color="#f38b4a"/>
      <stop offset="100%" stop-color="#f7d070"/>
    </linearGradient>
    <linearGradient id="rx-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#347d69"/>
      <stop offset="100%" stop-color="#8ac6a7"/>
    </linearGradient>
  </defs>

    <g id="heat-prep">
      <!-- Prep station inspecting doubanjiang -->
      <rect x="50" y="320" width="260" height="38" rx="8" fill="#e2d4be" stroke="#bfa98b" stroke-width="2.5"/>
      
    <!-- Legs & Shoes -->
    <path d="M143 355 L139 442 H167 L171 355 Z" fill="#102a43"/>
    <path d="M189 355 L193 442 H221 L217 355 Z" fill="#102a43"/>
    <rect x="131" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    <rect x="191" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    
      
    <!-- Torso: Lab coat over blue shirt & red flame tie -->
    <path d="M132 155 L126 355 H234 L228 155 Z" fill="#f8fbff" stroke="#d9e2ec" stroke-width="2"/>
    <path d="M156 155 L180 200 L204 155 Z" fill="#8ba8c4"/>
    <!-- Red tie -->
    <polygon points="174,195 186,195 189,275 180,290 171,275" fill="#e85d4a"/>
    <!-- Coat lapels -->
    <path d="M132 155 L162 220 L144 280 L132 355" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    <path d="M228 155 L198 220 L216 280 L228 355" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    
      <!-- Left hand steadying spice jar -->
      <path d="M135 175 Q115 235 125 295 L145 292 Q135 240 155 190 Z" fill="#f8fbff"/>
      <circle cx="128" cy="302" r="9" fill="#d8a77a"/>
      <rect x="115" y="295" width="24" height="32" rx="4" fill="#9b2c2c" stroke="#fff" stroke-width="1.5"/>
      <text x="127" y="316" font-size="10" font-family="sans-serif" font-weight="bold" fill="#fff" text-anchor="middle">醬</text>
      <!-- Right hand holding precision spoon -->
      <path d="M225 175 Q245 235 215 285 L198 280 Q225 235 205 190 Z" fill="#f8fbff"/>
      <circle cx="212" cy="290" r="9" fill="#d8a77a"/>
      <path d="M212 290 L185 315" stroke="#a0aec0" stroke-width="4" stroke-linecap="round"/>
      <circle cx="180" cy="318" r="6" fill="#c53030"/>
      
    <!-- Head & Hair -->
    <circle cx="180" cy="110" r="46" fill="#d8a77a"/>
    <!-- Neat, mature combed hair -->
    <path d="M134 104 Q138 58 180 60 Q224 62 226 106 Q204 88 180 86 Q156 86 134 104 Z" fill="#1e242b"/>
    <!-- Eyes -->
    <circle cx="163" cy="112" r="4" fill="#102a43"/>
    <circle cx="197" cy="112" r="4" fill="#102a43"/>
    <!-- Eyebrows -->
    <path d="M152 96 H172" fill="none" stroke="#1e242b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M188 96 H208" fill="none" stroke="#1e242b" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Glasses -->
    <g fill="none" stroke="#26394c" stroke-width="3.5">
      <rect x="146" cy="100" width="26" height="22" rx="6"/>
      <rect x="188" cy="100" width="26" height="22" rx="6"/>
      <path d="M172 111 H188"/>
    </g>
    <path d="M168 138 H192" fill="none" stroke="#7a4b3f" stroke-width="3.5" stroke-linecap="round"/>
    
    </g>
    
</svg>