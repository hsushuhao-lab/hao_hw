<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-fire" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="knife-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9e2ec"/>
      <stop offset="100%" stop-color="#9fb3c8"/>
    </linearGradient>
    <linearGradient id="wok-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334e68"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d84c38"/>
      <stop offset="50%" stop-color="#f38b4a"/>
      <stop offset="100%" stop-color="#f7d070"/>
    </linearGradient>
    <linearGradient id="rx-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#347d69"/>
      <stop offset="100%" stop-color="#8ac6a7"/>
    </linearGradient>
  </defs>

    <g id="speed-prep">
      <!-- Cutting board / prep table front -->
      <rect x="40" y="310" width="280" height="42" rx="10" fill="#e2d4be" stroke="#bfa98b" stroke-width="3"/>
      <rect x="70" y="318" width="80" height="24" rx="4" fill="#ffffff" opacity="0.85"/>
      <circle cx="200" cy="328" r="10" fill="#48bb78"/>
      <circle cx="225" cy="328" r="9" fill="#e53e3e"/>
      <circle cx="250" cy="330" r="12" fill="#a0aec0"/>
      
    <!-- Legs & Shoes -->
    <path d="M148 350 L144 442 H172 L176 350 Z" fill="#102a43"/>
    <path d="M184 350 L188 442 H216 L212 350 Z" fill="#102a43"/>
    <rect x="136" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    <rect x="186" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    
      
    <!-- Torso: Lab coat over shirt & tie -->
    <path d="M134 155 L126 355 H234 L226 155 Z" fill="#f8fbff" stroke="#d9e2ec" stroke-width="2"/>
    <path d="M156 155 L180 200 L204 155 Z" fill="#eceff1"/>
    <!-- Yellow tie -->
    <polygon points="174,195 186,195 189,275 180,290 171,275" fill="#f3b84a"/>
    <!-- Coat lapels -->
    <path d="M134 155 L162 220 L144 280 L132 355" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    <path d="M226 155 L198 220 L216 280 L228 355" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    
      <!-- Left hand stabilizing tofu block -->
      <path d="M135 170 Q105 230 110 295 L132 298 Q128 240 155 190 Z" fill="#f8fbff"/>
      <circle cx="112" cy="305" r="9" fill="#e6b88a"/>
      <rect x="95" y="312" width="26" height="20" rx="3" fill="#ffffff" stroke="#cbd5e0" stroke-width="2"/>
      <!-- Right hand holding knife in fast rhythm -->
      <path d="M225 170 Q255 220 240 280 L218 275 Q230 225 205 190 Z" fill="#f8fbff"/>
      <circle cx="236" cy="285" r="9" fill="#e6b88a"/>
      <path d="M236 280 L250 318 L235 320 L226 285 Z" fill="url(#knife-blade)" stroke="#9fb3c8" stroke-width="1.5"/>
      <!-- Action lines around knife -->
      <path d="M245 270 L260 260 M255 285 L275 280 M248 300 L268 302" stroke="#f3b84a" stroke-width="3" stroke-linecap="round"/>
      
    <!-- Head & Hair -->
    <circle cx="180" cy="110" r="46" fill="#e6b88a"/>
    <!-- Energetic swooping hair -->
    <path d="M134 100 Q140 60 180 58 Q224 60 228 102 Q210 85 188 88 Q156 90 134 100 Z" fill="#20252d"/>
    <path d="M160 65 Q170 48 195 60 Q175 62 160 65 Z" fill="#334050"/>
    <!-- Eyes -->
    <circle cx="162" cy="112" r="4" fill="#102a43"/>
    <circle cx="198" cy="112" r="4" fill="#102a43"/>
    <!-- Glasses -->
    <g fill="none" stroke="#26394c" stroke-width="3.5">
      <rect x="144" cy="100" width="28" height="22" rx="7"/>
      <rect x="188" cy="100" width="28" height="22" rx="7"/>
      <path d="M172 110 H188"/>
    </g>
    <!-- Eyebrows -->
    <path d="M148 94 Q160 88 172 92" fill="none" stroke="#20252d" stroke-width="3" stroke-linecap="round"/>
    <path d="M188 92 Q200 88 212 94" fill="none" stroke="#20252d" stroke-width="3" stroke-linecap="round"/>
    <path d="M166 138 H194" fill="none" stroke="#7a4b3f" stroke-width="3.5" stroke-linecap="round"/>
    
    </g>
    
</svg>