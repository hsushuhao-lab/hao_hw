<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-fire" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="knife-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9e2ec"/>
      <stop offset="100%" stop-color="#9fb3c8"/>
    </linearGradient>
    <linearGradient id="wok-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334e68"/>
      <stop offset="100%" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d84c38"/>
      <stop offset="50%" stop-color="#f38b4a"/>
      <stop offset="100%" stop-color="#f7d070"/>
    </linearGradient>
    <linearGradient id="rx-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#347d69"/>
      <stop offset="100%" stop-color="#8ac6a7"/>
    </linearGradient>
  </defs>

    <g id="strategy-idle">
      
    <!-- Legs & Shoes -->
    <path d="M138 360 L134 442 H162 L166 360 Z" fill="#102a43"/>
    <path d="M194 360 L198 442 H226 L222 360 Z" fill="#102a43"/>
    <rect x="126" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    <rect x="196" y="442" width="38" height="18" rx="8" fill="#1e3a5f"/>
    
      
    <!-- Torso: Lab coat over mint-green scrubs -->
    <path d="M132 160 L126 360 H234 L228 160 Z" fill="#f8fbff" stroke="#d9e2ec" stroke-width="2"/>
    <path d="M156 160 L180 205 L204 160 Z" fill="#57b2a4"/>
    <!-- Stethoscope around neck -->
    <path d="M145 165 Q150 240 165 265 L175 280" fill="none" stroke="#26394c" stroke-width="4" stroke-linecap="round"/>
    <path d="M215 165 Q210 240 195 265 L175 280" fill="none" stroke="#26394c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="175" cy="284" r="8" fill="#a0aec0" stroke="#26394c" stroke-width="2"/>
    <!-- Coat lapels -->
    <path d="M132 160 L162 225 L144 285 L132 360" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    <path d="M228 160 L198 225 L216 285 L228 360" fill="none" stroke="#cfd8dc" stroke-width="2.5"/>
    
      <!-- Left arm holding clinical order clipboard -->
      <path d="M132 175 Q95 215 105 270 L130 275 Q120 230 152 190 Z" fill="#f8fbff"/>
      <circle cx="112" cy="278" r="9" fill="#e6b88a"/>
      <!-- Clipboard with Rx chart -->
      <rect x="75" y="240" width="55" height="75" rx="5" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
      <rect x="80" y="248" width="45" height="62" rx="2" fill="#ffffff"/>
      <rect x="95" y="236" width="16" height="8" rx="2" fill="#cfd8dc"/>
      <path d="M85 260 H115 M85 270 H115 M85 280 H105 M85 290 H110" stroke="#57b2a4" stroke-width="2" stroke-linecap="round"/>
      <!-- Right hand holding fountain pen -->
      <path d="M228 175 Q265 215 250 265 L228 268 Q240 225 210 190 Z" fill="#f8fbff"/>
      <circle cx="244" cy="272" r="9" fill="#e6b88a"/>
      <rect x="242" y="250" width="6" height="26" rx="2" fill="#26394c"/>
      <polygon points="245,244 242,250 248,250" fill="#f3b84a"/>
      
    <!-- Head & Hair -->
    <circle cx="180" cy="110" r="46" fill="#e6b88a"/>
    <!-- Neat intellectual side-parted hair -->
    <path d="M134 104 Q144 58 180 62 Q224 62 226 108 Q200 90 180 90 Q156 88 134 104 Z" fill="#18314f"/>
    <!-- Eyes -->
    <circle cx="163" cy="112" r="4" fill="#102a43"/>
    <circle cx="197" cy="112" r="4" fill="#102a43"/>
    <!-- Round wireframe glasses -->
    <g fill="none" stroke="#26394c" stroke-width="3.5">
      <circle cx="160" cy="110" r="15"/>
      <circle cx="200" cy="110" r="15"/>
      <path d="M175 110 H185"/>
    </g>
    <!-- Eyebrows -->
    <path d="M150 92 Q160 88 170 92" fill="none" stroke="#18314f" stroke-width="3" stroke-linecap="round"/>
    <path d="M190 92 Q200 88 210 92" fill="none" stroke="#18314f" stroke-width="3" stroke-linecap="round"/>
    <!-- Mask resting below chin or covering mouth -->
    <path d="M154 132 Q180 148 206 132 L200 155 Q180 162 160 155 Z" fill="#72bdae" opacity="0.85"/>
    <path d="M168 138 Q180 143 192 138" fill="none" stroke="#7a4b3f" stroke-width="3" stroke-linecap="round"/>
    
    </g>
    
</svg>